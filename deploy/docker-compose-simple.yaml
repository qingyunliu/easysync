version: '2'

services:
  mysql:
    image: mysql:8.0
    container_name: easysync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: easysync
      MYSQL_USER: easysync
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - easysync-network

  redis:
    image: redis:7-alpine
    container_name: easysync-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - easysync-network

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: easysync-backend
    depends_on:
      - mysql
      - redis
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-easysync}:${MYSQL_PASSWORD:-changeme}@mysql:3306/${MYSQL_DATABASE:-easysync}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-changeme}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ../backend:/app
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - easysync-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  easysync-network: