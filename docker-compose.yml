version: '3.8'

services:
  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: easysync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: easysync
      MYSQL_USER: easysync
      MYSQL_PASSWORD: easysyncpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - easysync-network

  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: easysync-redis
    command: redis-server --requirepass redispassword
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - easysync-network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: easysync-backend
    depends_on:
      - mysql
      - redis
    environment:
      - DATABASE_URL=mysql://easysync:easysyncpassword@mysql:3306/easysync
      - REDIS_URL=redis://:redispassword@redis:6379/0
      - FLASK_ENV=production
      - SECRET_KEY=your-secret-key-here
      - JWT_SECRET_KEY=your-jwt-secret-key
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./config:/app/config
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - easysync-network

  # 任务调度服务
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: easysync-scheduler
    depends_on:
      - mysql
      - redis
      - backend
    environment:
      - DATABASE_URL=mysql://easysync:easysyncpassword@mysql:3306/easysync
      - REDIS_URL=redis://:redispassword@redis:6379/0
      - FLASK_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - easysync-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easysync-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - easysync-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: easysync-nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - easysync-network

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: easysync-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - easysync-network

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: easysync-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - easysync-network

  # 代理节点示例
  agent-node-01:
    build:
      context: ./backend/app/nodes/agent
      dockerfile: Dockerfile
    container_name: easysync-agent-01
    depends_on:
      - backend
    environment:
      - AGENT_CONFIG_PATH=/app/config/config.json
    volumes:
      - ./agent/config:/app/config
      - ./agent/logs:/app/logs
      - ./agent/data:/app/data
    restart: unless-stopped
    networks:
      - easysync-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  easysync-network:
    driver: bridge